<!DOCTYPE html>
<html>
  <head>
    <title>My OS - Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single&family=Ole&display=swap" rel="stylesheet">
  <style>
      body {
        margin: 0;
        background-color: bisque;
        position:relative;
        overflow-x: hidden;
      }
      .top-strip {
        width: 100%;
        height: 100px;
        object-fit: cover;
        object-position: top;
        display: block;
        position:absolute;
        top:-20px;      /* same as border width */
        left:0;
        z-index:1;
      }

  </style>
  </head>
  <body>
    <div style="border:rgb(121, 77, 84);border-width: 20px; border-style:solid; position:relative;height: calc(100vh - 40px); background-color:bisque ; box-sizing: border-box;">
      <p style="font-family:'Ole',cursive; font-size:67px; color:rgb(121,77,84) ; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0.67">NotWindows</p>
      <img src="images/desktop_.png" class="top-strip"/>
    </div>
  </body>
</html>
