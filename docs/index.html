<!DOCTYPE html>
<html>
  <head>
    <title>My OS</title>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single&family=Ole&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: bisque;
        position:relative
      }
      img {
        width: 100%;
        display: block;
      }
      @keyframes typing1 {
        from { width: 0; }
        to { width: 1100px; } /* adjust based on your text's actual rendered width */
      }
      @keyframes typing2 {
        from { width: 0; }
        to { width: 500px; }
      }
      @keyframes blink {
        50% { border-color: transparent; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      .light {
        position: absolute;
        width: 14px;
        height: 14px;
        background: rgb(193, 181, 113);
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 8px rgb(75, 71, 43);
        animation: twinkle 2.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <img src="images/welcome.png" />

    <!-- twinkling lights -->
    <div class="light" style="top: 30px; left: 5%; animation-delay: 0s;"></div>
    <div class="light" style="top: 90px; left: 20%; animation-delay: 0.5s;"></div>
    <div class="light" style="top: 60px; left: 45%; animation-delay: 1s;"></div>
    <div class="light" style="top: 140px; left: 70%; animation-delay: 1.5s;"></div>
    <div class="light" style="top: 50px; left: 90%; animation-delay: 2s;"></div>

    <p style= "font-family:'Ole', cursive;
      font-size:100px;
      font-weight:bolder;
      color:rgb(207, 114, 153);
      text-shadow: 4px 4px 4px #aaa;
      padding-left:150px;
      margin-top:0px;
      margin-bottom:7px;
      overflow:hidden;
      white-space:nowrap;
      width:0;
      border-right:4px solid rgb(207, 114, 153);
      animation: typing1 3s steps(35, end) forwards, blink 0.7s step-end infinite;">
      Hey, there! Welcome to my OS!
    </p>

    <p style="font-family:'Bitcount Single',monospace;
      font-weight:bold;
      font-size:25px;
      padding-left: 451px;
      color:rgb(207, 114, 153);
      overflow:hidden;
      white-space:nowrap;
      width:0;
      border-right:3px solid rgb(207, 114, 153);
      animation: typing2 2s steps(25, end) 3s forwards, blink 0.7s step-end 3s infinite;">
    EXPLORE AND PLAY AROUND!!!
    </p>

    <a href="https://open.spotify.com/playlist/6b3VmOUFzlslBXNsDovBFL?si=f9337d22ae384bf2" target="_blank">here's some music for ya!</a>
  
  </body>

</html>
